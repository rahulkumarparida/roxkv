services:
  # ─── Ollama: Local LLM inference ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-init.sh"]
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:latest}
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./scripts/ollama-init.sh:/usr/local/bin/ollama-init.sh:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - roxkv-net

  # ─── RoxKV + RoxAI Backend ───────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HOME: /root
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
    ports:
      - "${BACKEND_TCP_PORT:-6969}:6969"        # Native CLI TCP
      - "${BACKEND_AI_TCP_PORT:-6970}:6970"      # AI Chat TCP
      - "${BACKEND_EVENTS_PORT:-6971}:6971"      # HTTP / SSE API
      - "${BACKEND_CHAT_PORT:-6972}:6972"        # AI Chat HTTP
      - "${BACKEND_RESP_PORT:-6973}:6973"        # RESP TCP (redis-cli)
    volumes:
      - roxkv-data:/root/.roxkv
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - roxkv-net

  # ─── React Web Dashboard ────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - roxkv-net

networks:
  roxkv-net:
    driver: bridge

volumes:
  ollama-data:
  roxkv-data:
