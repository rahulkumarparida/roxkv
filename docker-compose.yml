services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped

    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-init.sh"]

    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:latest}

    ports:
      - "11434:11434"

    volumes:
      - ollama-data:/root/.ollama
      - ./scripts/ollama-init.sh:/usr/local/bin/ollama-init.sh:ro

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

    networks:
      - roxkv-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    environment:
      HOME: /root
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      NODE_ENV: ${NODE_ENV:-development}
    command: ["go", "run", "./cmd/roxkv", "roxkv-tcp"]
    ports:
      - "${BACKEND_TCP_PORT:-6969}:6969"
      - "${BACKEND_AI_TCP_PORT:-6970}:6970"
      - "${BACKEND_EVENTS_PORT:-6971}:6971"
      - "${BACKEND_CHAT_PORT:-6972}:6972"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - roxkv-data:/root/.roxkv
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6971/healthz >/dev/null && wget -qO- http://127.0.0.1:6972/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 10
    networks:
      - roxkv-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      PORT: ${FRONTEND_PORT:-5173}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:6971}
      VITE_CHAT_API_BASE_URL: ${VITE_CHAT_API_BASE_URL:-http://localhost:6972}
      VITE_BACKEND_SSE_TARGET: ${VITE_BACKEND_SSE_TARGET:-http://backend:6971}
      VITE_BACKEND_CHAT_TARGET: ${VITE_BACKEND_CHAT_TARGET:-http://backend:6972}
      VITE_CONNECTION_HOST_LABEL: ${VITE_CONNECTION_HOST_LABEL:-backend via frontend proxy}
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./WebDashBoard/roxkv-dashboard:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 10
    networks:
      - roxkv-net

networks:
  roxkv-net:
    driver: bridge

volumes:
  ollama-data:
  roxkv-data:
  go-mod-cache:
  go-build-cache:
  frontend-node-modules:
